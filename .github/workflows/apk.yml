name: Build APK

on:
  push:
    branches: [main]
    paths: ['capacitor.config.json', 'package.json', 'package-lock.json', 'www/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap add android
      - run: npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: android
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk doechatgi-preview.apk
          gh release view preview-apk >/dev/null 2>&1 || gh release create preview-apk --title "Android 미리보기" --notes "테스트용 디버그 APK예요."
          gh release upload preview-apk doechatgi-preview.apk --clobber
